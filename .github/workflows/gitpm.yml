# Self-hosted: this workflow lives in the gitpm repo and manages this repo's
# own PRs by default (GITPM_REPOS defaults to the current repo). Leave the
# checkout step alone - it fetches gitpm's own source code, which the run
# steps below need to import the gitpm package.
# To manage a DIFFERENT repo instead, just point GITPM_REPOS at it, e.g.
# GITPM_REPOS: org/target. The default secrets.GITHUB_TOKEN only has access
# to the repo the workflow runs in, so you'll also need to add a PAT with
# write access to the target repo as a secret and use it in place of
# secrets.GITHUB_TOKEN below.
# Requires repo secret ANTHROPIC_API_KEY (Settings -> Secrets and variables -> Actions).
name: gitpm
on:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: "0 9 * * 1-5"   # weekday standup, 9am UTC
  workflow_dispatch:         # lets you run either job by hand from the Actions tab
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [triage, standup]
        default: standup
permissions:
  pull-requests: write
  issues: write
  contents: read
jobs:
  triage:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.job == 'triage')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m gitpm triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITPM_REPOS: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  standup:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.job == 'standup')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITPM_REPOS: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m gitpm standup >> "$GITHUB_STEP_SUMMARY"
