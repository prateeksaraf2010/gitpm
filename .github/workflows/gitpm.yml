# Drop this into any repo you want managed. Requires secret ANTHROPIC_API_KEY.
# Uses the workflow's own GITHUB_TOKEN, so no PAT is needed.
name: gitpm
on:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: "0 9 * * 1-5"   # weekday standup
permissions:
  pull-requests: write
  issues: write
  contents: read
jobs:
  triage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: YOUR_ORG/gitpm, path: gitpm }   # where you host this project
      - run: python -m gitpm triage
        working-directory: gitpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITPM_REPOS: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  standup:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: YOUR_ORG/gitpm, path: gitpm }
      - working-directory: gitpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITPM_REPOS: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m gitpm standup >> "$GITHUB_STEP_SUMMARY"
